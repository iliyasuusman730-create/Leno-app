concurrency: name: Build Leno APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
      - name: Setup Gradle wrapper 9.3.1
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build APK - show error clearly
        run: |
          ./gradlew assembleDebug --stacktrace || (echo "--- FAILED LOGS ---" && ./gradlew assembleDebug --info | grep -A 20 "What went wrong" && exit 1)
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Leno-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk
