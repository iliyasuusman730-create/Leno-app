name: Build Leno APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      - name: Fix SDK and create gradlew
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Create dummy google-services.json for CI
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "leno-app-dummy",
              "storage_bucket": "leno-app-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:dummy123",
                  "android_client_info": {
                    "package_name": "com.leno.chat"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCIBuildOnly123"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          echo "Created for package com.leno.chat"
          cat app/google-services.json

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Leno-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
