name: Build Leno APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      - name: Fix SDK and create gradlew
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Create dummy google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {"project_number": "1234567890","project_id": "leno-app-dummy","storage_bucket": "leno-app-dummy.appspot.com"},
            "client": [
              {"client_info": {"mobilesdk_app_id": "1:1234567890:android:a0","android_client_info": {"package_name": "com.aistudio.lenochat.xkdfzq"}},"oauth_client": [{"client_id": "1234567890-dummywebclient.apps.googleusercontent.com","client_type": 3}],"api_key": [{"current_key": "AIzaSyDummy"}],"services": {"appinvite_service": {"other_platform_oauth_client": [{"client_id": "1234567890-dummywebclient.apps.googleusercontent.com","client_type": 3}]}}},
              {"client_info": {"mobilesdk_app_id": "1:1234567890:android:a1","android_client_info": {"package_name": "com.leno.chat"}},"oauth_client": [{"client_id": "1234567890-dummywebclient.apps.googleusercontent.com","client_type": 3}],"api_key": [{"current_key": "AIzaSyDummy"}],"services": {"appinvite_service": {"other_platform_oauth_client": [{"client_id": "1234567890-dummywebclient.apps.googleusercontent.com","client_type": 3}]}}},
              {"client_info": {"mobilesdk_app_id": "1:1234567890:android:b2","android_client_info": {"package_name": "com.leno.chat.debug"}},"oauth_client": [{"client_id": "1234567890-dummywebclient.apps.googleusercontent.com","client_type": 3}],"api_key": [{"current_key": "AIzaSyDummy"}],"services": {"appinvite_service": {"other_platform_oauth_client": [{"client_id": "1234567890-dummywebclient.apps.googleusercontent.com","client_type": 3}]}}}
            ],
            "configuration_version": "1"
          }
          EOF
          else
            echo "Using existing app/google-services.json"
          fi

      - name: Create debug.keystore that your app needs
        run: |
          echo "Creating debug.keystore in root..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US" || true
          ls -l debug.keystore app/debug.keystore || true
          echo "Keystore created!"

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Leno-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0-build-${{ github.run_number }}
          name: Leno Build ${{ github.run_number }}
          body: "Leno APK - Build ${{ github.run_number }} - Download and install"
          files: "**/build/outputs/apk/debug/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
